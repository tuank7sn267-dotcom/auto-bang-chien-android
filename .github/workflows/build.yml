name: Build Auto Bang Chien V3 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lưu APK (tải ở mục Artifacts của lần chạy)
        uses: actions/upload-artifact@v4
        with:
          name: auto-bang-chien-v3-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Đăng APK lên mục Releases (bản mới nhất)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: Auto Bang Chiến V3 - bản thử nghiệm
          body: Auto Bang Chiến V3. Bản thử nghiệm thích nghi tọa độ và tỷ lệ màn hình. Tải app-debug.apk để kiểm tra.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
